spring.application.name=jobtrack-backend

# Supabase PostgreSQL (required to run — set in environment or .env)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

#
# Keep the backend deployable before Phase 1 migrations exist.
# When ready to enforce schema, set HIBERNATE_DDL_AUTO=validate in the
# environment.
#
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Don't fail the whole Spring context if the DB is temporarily unreachable at
# startup (important for the initial Render deploy).
spring.datasource.hikari.initialization-fail-timeout=-1

# Supabase Auth — JWT validation (Phase 2)
supabase.url=${SUPABASE_URL}
supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# Flyway SQL migrations (Phase 1 — Database)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Allows Flyway to run even if the database is not empty (common with Supabase).
spring.flyway.baseline-on-migrate=true

server.port=${PORT:8080}
