services:
  - type: web
    name: jobtrack-backend
    runtime: docker
    rootDir: jobtrack-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HIBERNATE_DDL_AUTO
        value: "none"
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
