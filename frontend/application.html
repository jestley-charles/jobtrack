<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View application details in JobTrack.">
  <title>Application — JobTrack</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-page">
  <div class="app-layout">
    <header class="app-header">
      <a class="app-brand" href="dashboard.html">JobTrack</a>
      <div class="app-user-menu">
        <button type="button" class="app-user-trigger" id="user-menu-btn" aria-expanded="false" aria-haspopup="true" aria-controls="user-menu">
          <span class="app-user-initials" id="user-initials" aria-hidden="true">?</span>
          <span class="app-user-chevron" aria-hidden="true">▼</span>
          <span class="visually-hidden">Account menu</span>
        </button>
        <div class="app-user-dropdown" id="user-menu" hidden>
          <p class="app-user-email" id="user-email"></p>
          <button type="button" class="btn btn-secondary btn-sm btn-block" id="logout-btn">Log out</button>
        </div>
      </div>
    </header>

    <div class="app-body">
      <nav class="app-sidebar" aria-label="App">
        <ul class="app-nav">
          <li><a href="dashboard.html" class="app-nav-link" data-nav="dashboard">Dashboard</a></li>
          <li><a href="jobs.html" class="app-nav-link" data-nav="jobs">Jobs</a></li>
          <li><a href="interviews.html" class="app-nav-link" data-nav="interviews">Interviews</a></li>
          <li><a href="offers.html" class="app-nav-link" data-nav="offers">Offers</a></li>
          <li><a href="rejected.html" class="app-nav-link" data-nav="rejected">Rejected</a></li>
          <li><a href="settings.html" class="app-nav-link" data-nav="settings">Settings</a></li>
        </ul>
      </nav>

      <main class="app-main">
        <p class="application-detail-back">
          <a href="jobs.html" class="application-detail-back-link">← Back to jobs</a>
        </p>

        <p class="dashboard-message" id="application-loading" hidden>Loading application…</p>
        <p class="dashboard-message dashboard-message--error" id="application-error" hidden></p>

        <div id="application-content" hidden>
          <header class="app-page-header app-page-header--split application-detail-header">
            <div>
              <h1 id="application-title">Application</h1>
              <p class="application-detail-subtitle" id="application-subtitle"></p>
            </div>
            <div class="application-detail-actions">
              <button type="button" class="btn btn-secondary btn-refresh" id="application-refresh-btn" aria-label="Refresh">
                <svg class="btn-refresh-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>
                </svg>
                <span class="btn-refresh-label">Refresh</span>
              </button>
              <button type="button" class="btn btn-secondary" id="edit-application-btn">Edit</button>
              <button type="button" class="btn btn-danger" id="delete-application-btn">Delete</button>
            </div>
          </header>

          <p class="dashboard-message dashboard-message--error" id="application-action-error" hidden></p>

          <div class="application-detail-grid">
            <section class="application-detail-card" aria-labelledby="application-info-heading">
              <h2 id="application-info-heading">Details</h2>
              <dl class="detail-list" id="application-details"></dl>
            </section>

            <section class="application-detail-card" aria-labelledby="application-interviews-heading">
              <div class="application-detail-card-header">
                <h2 id="application-interviews-heading">Interviews</h2>
                <button type="button" class="btn btn-secondary btn-sm" id="add-interview-btn">Add interview</button>
              </div>
              <p class="dashboard-message" id="interviews-loading" hidden>Loading interviews…</p>
              <p class="dashboard-message dashboard-message--error" id="interviews-section-error" hidden></p>
              <p class="application-detail-empty" id="interviews-empty" hidden>No interviews scheduled for this application yet.</p>
              <ul class="interview-list" id="interview-list" hidden></ul>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal" id="application-modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-modal-close tabindex="-1"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="application-modal-title">
      <form id="application-form" class="application-form" novalidate>
        <header class="modal-header">
          <h2 id="application-modal-title">Edit application</h2>
          <button type="button" class="modal-close" data-modal-close aria-label="Close">&times;</button>
        </header>

        <div class="modal-body">
          <div class="form-field">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" required autocomplete="organization">
          </div>
          <div class="form-field">
            <label for="position">Position</label>
            <input type="text" id="position" name="position" required autocomplete="organization-title">
          </div>
          <div class="form-field">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g. Remote, New York, NY" autocomplete="address-level2">
          </div>
          <div class="form-row form-row--split">
            <div class="form-field">
              <label for="salaryMin">Salary min</label>
              <input type="number" id="salaryMin" name="salaryMin" min="0" step="1000" placeholder="90000">
            </div>
            <div class="form-field">
              <label for="salaryMax">Salary max</label>
              <input type="number" id="salaryMax" name="salaryMax" min="0" step="1000" placeholder="120000">
            </div>
          </div>
          <div class="form-field">
            <label for="status">Status</label>
            <select id="status" name="status" required>
              <option value="Wishlist">Wishlist</option>
              <option value="Applied">Applied</option>
              <option value="Interview">Interview</option>
              <option value="Offer">Offer</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>
          <div class="form-field">
            <label for="dateApplied">Date applied</label>
            <input type="date" id="dateApplied" name="dateApplied">
          </div>
          <div class="form-field">
            <label for="jobUrl">Job URL</label>
            <input type="url" id="jobUrl" name="jobUrl" placeholder="https://…" autocomplete="url">
          </div>
          <p id="application-form-error" class="form-message form-message--error" hidden></p>
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="application-form-submit">Save changes</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="modal" id="interview-modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-interview-modal-close tabindex="-1"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="interview-modal-title">
      <form id="interview-form" class="interview-form" novalidate>
        <header class="modal-header">
          <h2 id="interview-modal-title">Add interview</h2>
          <button type="button" class="modal-close" data-interview-modal-close aria-label="Close">&times;</button>
        </header>

        <div class="modal-body">
          <div class="form-field" id="interview-application-field" hidden>
            <label for="interviewApplicationId">Application</label>
            <select id="interviewApplicationId" name="applicationId">
              <option value="">Select an application</option>
            </select>
          </div>
          <div class="form-field">
            <label for="interviewDate">Date &amp; time</label>
            <input type="datetime-local" id="interviewDate" name="interviewDate" required>
          </div>
          <div class="form-field">
            <label for="interviewType">Type</label>
            <input type="text" id="interviewType" name="interviewType" list="interview-type-options" placeholder="e.g. Technical, Behavioral, Onsite">
            <datalist id="interview-type-options">
              <option value="Phone screen"></option>
              <option value="Technical"></option>
              <option value="Behavioral"></option>
              <option value="Onsite"></option>
              <option value="Final"></option>
            </datalist>
          </div>
          <div class="form-field">
            <label for="interviewer">Interviewer</label>
            <input type="text" id="interviewer" name="interviewer" placeholder="Name or role">
          </div>
          <div class="form-field">
            <label for="interviewResult">Result</label>
            <input type="text" id="interviewResult" name="result" list="interview-result-options" placeholder="e.g. Pending, Passed, Rejected">
            <datalist id="interview-result-options">
              <option value="Pending"></option>
              <option value="Passed"></option>
              <option value="Rejected"></option>
            </datalist>
          </div>
          <div class="form-field">
            <label for="interviewNotes">Notes</label>
            <textarea id="interviewNotes" name="notes" rows="3" placeholder="Prep notes, questions, follow-ups…"></textarea>
          </div>
          <p id="interview-form-error" class="form-message form-message--error" hidden></p>
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn btn-secondary" data-interview-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="interview-form-submit">Add interview</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data-cache.js"></script>
  <script src="js/interview-briefing.js"></script>
  <script src="js/confirm-modal.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/application-form.js"></script>
  <script src="js/interview-form.js"></script>
  <script src="js/application-detail.js"></script>
</body>
</html>
