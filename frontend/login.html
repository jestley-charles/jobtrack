<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to JobTrack to manage your job applications, interviews, and contacts.">
  <title>Log in — JobTrack</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <div class="auth-layout">
    <aside class="auth-aside">
      <a class="auth-aside-brand" href="index.html">JobTrack</a>
      <p class="auth-aside-tagline">Welcome back.</p>
      <ul class="auth-aside-list">
        <li>Pick up where you left off</li>
        <li>Your applications and pipeline are waiting</li>
        <li>Only you can see your data</li>
      </ul>
    </aside>

    <main class="auth-card">
      <a class="auth-brand auth-brand--mobile" href="index.html">JobTrack</a>
      <h1>Log in</h1>
      <p class="auth-subtitle">Sign in to manage your applications.</p>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required minlength="6">
        </div>
        <p id="form-error" class="form-message form-message--error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/interview-briefing.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
