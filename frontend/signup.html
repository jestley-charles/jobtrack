<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — JobTrack</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="auth-brand" href="index.html">JobTrack</a>
    <h1>Create your account</h1>
    <p class="auth-subtitle">Start tracking applications, interviews, and contacts in one place.</p>

    <form id="signup-form" class="auth-form" novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
        <span class="field-hint">At least 6 characters</span>
      </div>
      <p id="form-error" class="form-message form-message--error" hidden></p>
      <p id="form-success" class="form-message form-message--success" hidden></p>
      <button type="submit" class="btn btn-primary" id="submit-btn">Sign up</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
